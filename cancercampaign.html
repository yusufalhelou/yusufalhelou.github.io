<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حملة الوقاية من السرطان</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin-bottom: 20px;
            width: 100%;
        }

        .btn {
            border: 2px dashed #3498db;
            color: #3498db;
            background-color: #f0f8ff;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #e1f0fa;
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .controls {
            display: none; /* Hidden until image upload */
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .logo-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo-btn {
            padding: 10px 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .logo-btn.active {
            background-color: #e74c3c; /* Pink/Red for cancer awareness */
            color: white;
            border-color: #e74c3c;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            display: none;
        }

        .download-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            display: none;
            width: 100%;
            font-family: 'Cairo', sans-serif;
        }

        .download-btn:hover {
            background-color: #219150;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>حملة الوقاية من السرطان 🎗️</h1>
        <p style="color: #777; font-size: 0.9rem;">ارفع صورتك وأضف شعار الحملة لدعم التوعية</p>

        <div class="upload-btn-wrapper">
            <button class="btn">📸 اضغط لرفع صورة</button>
            <input type="file" id="uploadInput" accept="image/*" />
        </div>

        <canvas id="canvas"></canvas>

        <div class="controls" id="controls">
            <p>اختر الشعار:</p>
            <div class="logo-options">
                <button class="logo-btn active" onclick="setLogo(1)">الشعار الأول</button>
                <button class="logo-btn" onclick="setLogo(2)">الشعار الثاني</button>
            </div>
            
            <button class="download-btn" id="downloadBtn" onclick="downloadImage()">💾 تحميل الصورة</button>
        </div>
    </div>

    <script>
        const uploadInput = document.getElementById('uploadInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const controls = document.getElementById('controls');
        const downloadBtn = document.getElementById('downloadBtn');
        
        let userImage = new Image();
        
        let logo1Image = new Image();
        let logo2Image = new Image();
        
        let currentLogoId = 1;
        let isImageLoaded = false;

        const logo1Url = "https://raw.githubusercontent.com/yusufalhelou/yusufalhelou.github.io/main/assets/images/website/White%20150px%201to1.png";
        const logo2Url = "https://raw.githubusercontent.com/yusufalhelou/yusufalhelou.github.io/main/assets/images/website/White%20150px%201to1.png";

        logo1Image.crossOrigin = "Anonymous";
        logo1Image.src = logo1Url;
        logo1Image.onload = function() { if(isImageLoaded) draw(); };

        logo2Image.crossOrigin = "Anonymous";
        logo2Image.src = logo2Url;
        logo2Image.onload = function() { if(isImageLoaded) draw(); };

        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                userImage = new Image();
                userImage.onload = function() {
                    isImageLoaded = true;
                    // Reset UI
                    controls.style.display = 'block';
                    canvas.style.display = 'block';
                    downloadBtn.style.display = 'block';
                    // Draw immediately
                    draw();
                }
                userImage.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        function setLogo(id) {
            currentLogoId = id;
            // Update UI buttons
            document.querySelectorAll('.logo-btn').forEach((btn, index) => {
                if(index + 1 === id) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            draw();
        }

        function draw() {
            if (!isImageLoaded) return;
            
            canvas.width = userImage.width;
            canvas.height = userImage.height;

            ctx.drawImage(userImage, 0, 0);

            let activeLogo = (currentLogoId === 1) ? logo1Image : logo2Image;

            if (activeLogo.complete && activeLogo.naturalWidth !== 0) {
                const logoSize = Math.min(canvas.width, canvas.height) * 0.25; 
                const padding = logoSize * 0.1;
                const x = canvas.width - logoSize - padding;
                const y = canvas.height - logoSize - padding;
                
                ctx.drawImage(activeLogo, x, y, logoSize, logoSize);
            }
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'campaign-photo.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
