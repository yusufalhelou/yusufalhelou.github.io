<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",

</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { 
            getAuth, 
            signInAnonymously, 
            onAuthStateChanged
        } from 'firebase/auth';
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            onSnapshot
        } from 'firebase/firestore';
        import { 
            Heart, Lock, Eye, EyeOff, Check, X, ChevronRight, ChevronLeft,
            Trophy, Sparkles, Flame, LogIn, AlertCircle, Loader2, Sun, Moon,
            Clock, CloudRain, LogOut, PenTool, Eraser, Save, Trash2, Undo
        } from 'lucide-react';

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyCGnQ_NtPrNEoQNVoG2p_0u_18vVVZcZLc",
            authDomain: "yomna-challenge.firebaseapp.com",
            projectId: "yomna-challenge",
            storageBucket: "yomna-challenge.firebasestorage.app",
            messagingSenderId: "639434172856",
            appId: "1:639434172856:web:08bcb6bed0d4baaca3c74d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'yomna-forever';

        // --- Styles ---
        const styles = `
            @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap');
            @import url('https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap');

            :root {
                --font-cairo: 'Cairo', sans-serif;
                --font-hand: 'Indie Flower', cursive;
            }

            body {
                font-family: 'Cairo', sans-serif !important;
            }

            /* Hide default browser password reveal button */
            input::-ms-reveal,
            input::-ms-clear {
                display: none;
            }

            @keyframes float {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-10px); }
                100% { transform: translateY(0px); }
            }
            @keyframes gradient {
                0% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
            }
            @keyframes pop {
                0% { transform: scale(1); }
                50% { transform: scale(1.2); }
                100% { transform: scale(1); }
            }
            @keyframes burn {
                0% { transform: scale(1); filter: brightness(100%); }
                50% { transform: scale(1.1); filter: brightness(120%); }
                100% { transform: scale(1); filter: brightness(100%); }
            }
            @keyframes drop {
                0% { transform: translateY(-20px); opacity: 0; }
                50% { opacity: 1; }
                100% { transform: translateY(20px); opacity: 0; }
            }
            .glass-card {
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.5);
            }
            .glass-button {
                background: rgba(255, 255, 255, 0.9);
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
                backdrop-filter: blur(5px);
                border: 1px solid rgba(255, 255, 255, 0.3);
            }
            .sticky-note {
                background: #fef9c3;
                box-shadow: 5px 5px 15px rgba(0,0,0,0.15);
                transform: rotate(-1deg);
                transition: transform 0.2s;
            }
            .sticky-note:hover {
                transform: rotate(0deg) scale(1.02);
            }
            .animate-float { animation: float 6s ease-in-out infinite; }
            .animate-burn { animation: burn 1.5s ease-in-out infinite; }
            .animate-drop { animation: drop 2s ease-in-out infinite; }
            .animate-gradient {
                background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffd1ff, #fbc2eb);
                background-size: 400% 400%;
                animation: gradient 15s ease infinite;
            }
            .heart-beat {
                animation: pop 1s infinite;
            }
        `;

        // --- Components ---

        // 1. Login Component
        const LoginScreen = ({ onLogin }) => {
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [isFocused, setIsFocused] = useState(false);
            const [showPassword, setShowPassword] = useState(false); 
            const SECRET_PASS = "yomna"; 

            const handleSubmit = (e) => {
                e.preventDefault();
                if (password.toLowerCase() === SECRET_PASS) {
                    localStorage.setItem('yomna_app_auth', 'true');
                    onLogin();
                } else {
                    setError('مش صح.. جربي تاني 😉');
                }
            };

            return (
                <div className="min-h-screen w-full flex items-center justify-center p-4 animate-gradient font-sans relative overflow-hidden" dir="rtl">
                    <style>{styles}</style>
                    
                    <div className="absolute top-20 left-20 opacity-20 animate-float" style={{animationDelay: '0s'}}>
                        <Heart size={100} fill="white" stroke="none" />
                    </div>
                    <div className="absolute bottom-20 right-20 opacity-20 animate-float" style={{animationDelay: '2s'}}>
                        <Sparkles size={80} color="white" />
                    </div>

                    <div className="glass-card rounded-3xl shadow-2xl p-8 max-w-md w-full text-center relative z-10">
                        <div className="flex justify-center mb-6">
                            <div className="bg-pink-100/50 p-4 rounded-full shadow-inner">
                                <Heart className="w-12 h-12 text-pink-500 fill-pink-500 animate-pulse" />
                            </div>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="space-y-5 mt-8">
                            <div className="relative group">
                                {!showPassword && (
                                    <div className={`absolute inset-0 rounded-xl border transition-all pointer-events-none flex items-center justify-center z-0 ${isFocused ? 'bg-white border-pink-400 ring-2 ring-pink-100' : 'bg-white/50 border-white/60'}`}>
                                        <div className="flex justify-center items-center gap-1 overflow-hidden h-full px-12">
                                            {password.length === 0 && !isFocused && (
                                                <span className="text-gray-400 opacity-70 font-bold"></span>
                                            )}
                                            {password.split('').map((_, i) => (
                                                <Heart key={i} size={12} className="text-pink-500 fill-pink-500 heart-beat" style={{ animationDelay: `${i * 0.1}s` }} />
                                            ))}
                                            {isFocused && (
                                                <div className="w-0.5 h-5 bg-pink-500 animate-pulse ml-0.5" />
                                            )}
                                        </div>
                                    </div>
                                )}

                                <Lock className={`absolute right-4 top-3.5 w-5 h-5 transition-colors z-10 ${isFocused ? 'text-pink-500' : 'text-gray-400'}`} />

                                <button
                                    type="button"
                                    onClick={() => setShowPassword(!showPassword)}
                                    className="absolute left-4 top-3.5 z-30 text-gray-400 hover:text-pink-500 transition-colors focus:outline-none"
                                >
                                    {showPassword ? <EyeOff size={20} /> : <Eye size={20} />}
                                </button>

                                <input 
                                    type={showPassword ? "text" : "password"}
                                    value={password}
                                    onFocus={() => setIsFocused(true)}
                                    onBlur={() => setIsFocused(false)}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className={`w-full px-12 py-3.5 border-none rounded-xl focus:outline-none focus:ring-0 z-20 relative text-center font-bold font-mono tracking-widest
                                        ${showPassword 
                                            ? 'bg-white/50 border border-white/60 text-gray-700 placeholder-gray-400 focus:bg-white focus:ring-2 focus:ring-pink-400' 
                                            : 'bg-transparent text-transparent caret-transparent cursor-text'
                                        }`}
                                    placeholder={showPassword ? "" : ""}
                                    dir="ltr" 
                                    autoComplete="off"
                                />
                            </div>
                            
                            {error && <p className="text-red-500 text-sm font-bold bg-red-50 py-1 px-3 rounded-lg inline-block">{error}</p>}
                            
                            <button 
                                type="submit"
                                className="w-full bg-gradient-to-r from-pink-500 to-rose-400 hover:from-pink-600 hover:to-rose-500 text-white py-3.5 rounded-xl font-bold shadow-lg transform transition hover:-translate-y-0.5 active:scale-95 flex items-center justify-center gap-2"
                            >
                                <LogIn size={24} strokeWidth={2.5} />
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // 2. Sticky Note Canvas Component
        const StickyNoteCanvas = ({ isOpen, onClose, onSave, onDelete, initialData, date }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [color, setColor] = useState('#000000');
            const [lineWidth, setLineWidth] = useState(3);
            const [isSaving, setIsSaving] = useState(false);
            const [history, setHistory] = useState([]);

            useEffect(() => {
                if (isOpen && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    
                    canvas.width = 320;
                    canvas.height = 320;
                    
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    
                    ctx.fillStyle = '#fef9c3';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    if (initialData) {
                        const img = new Image();
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0);
                            setHistory([canvas.toDataURL()]); 
                        };
                        img.src = initialData;
                    } else {
                        setHistory([canvas.toDataURL()]); 
                    }
                }
            }, [isOpen, initialData]);

            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x * scaleX, y * scaleY);
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;

                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                const ctx = canvas.getContext('2d');
                ctx.lineTo(x * scaleX, y * scaleY);
                ctx.stroke();
            };

            const stopDrawing = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                
                const canvas = canvasRef.current;
                const newState = canvas.toDataURL();
                setHistory(prev => [...prev, newState]);
            };

            const handleUndo = () => {
                if (history.length <= 1) return; 

                const newHistory = [...history];
                newHistory.pop(); 
                setHistory(newHistory);

                const prevState = newHistory[newHistory.length - 1];
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = prevState;
            };

            const handleSave = async () => {
                setIsSaving(true);
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/png', 0.8); 
                await onSave(dataUrl);
                setIsSaving(false);
                onClose();
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
                    <div className="relative w-full max-w-sm sticky-note p-4 rounded-sm animate-[pop_0.3s_ease-out]">
                        
                        <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 w-32 h-8 bg-white/40 rotate-1 backdrop-blur-md shadow-sm border border-white/20"></div>

                        <div className="flex justify-between items-center mb-2 mt-2">
                            <h3 className="font-['Indie_Flower'] text-gray-700 font-bold text-xl flex items-center gap-2">
                                <PenTool size={18} />
                                🎨
                            </h3>
                            <button onClick={onClose} className="p-1 hover:bg-black/10 rounded-full transition-colors">
                                <X size={20} className="text-gray-600" />
                            </button>
                        </div>

                        <div className="border-2 border-dashed border-gray-400/30 rounded-lg overflow-hidden bg-[#fef9c3] touch-none shadow-inner mb-4 relative">
                            <canvas
                                ref={canvasRef}
                                className="w-full h-auto aspect-square cursor-crosshair block"
                                onMouseDown={startDrawing}
                                onMouseMove={draw}
                                onMouseUp={stopDrawing}
                                onMouseLeave={stopDrawing}
                                onTouchStart={startDrawing}
                                onTouchMove={draw}
                                onTouchEnd={stopDrawing}
                            />
                        </div>

                        <div className="flex flex-col gap-3">
                            <div className="flex justify-center gap-3">
                                {['#000000', '#ef4444', '#eab308', '#3b82f6', '#22c55e', '#a855f7'].map((c) => (
                                    <button
                                        key={c}
                                        onClick={() => { setColor(c); setLineWidth(3); }}
                                        className={`w-8 h-8 rounded-full border-2 transition-transform ${color === c && lineWidth !== 20 ? 'scale-125 border-gray-600' : 'border-transparent hover:scale-110'}`}
                                        style={{ backgroundColor: c }}
                                    />
                                ))}
                                <button
                                    onClick={() => { setColor('#fef9c3'); setLineWidth(20); }} 
                                    className={`w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center border-2 transition-transform ${lineWidth === 20 ? 'scale-125 border-gray-600' : 'border-transparent'}`}
                                >
                                    <Eraser size={16} className="text-gray-600" />
                                </button>
                            </div>

                            <div className="flex gap-2 border-t border-gray-400/20 pt-3">
                                <button 
                                    onClick={handleUndo}
                                    disabled={history.length <= 1}
                                    className={`flex-1 py-2 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-colors
                                        ${history.length <= 1 
                                            ? 'bg-gray-100 text-gray-400 cursor-not-allowed' 
                                            : 'bg-orange-100 hover:bg-orange-200 text-orange-600'}`}
                                    title="تراجع عن آخر خطوة"
                                >
                                    <Undo size={16} />
                                    تراجع
                                </button>
                                <button 
                                    onClick={handleSave}
                                    disabled={isSaving}
                                    className="flex-[2] py-2 px-4 rounded-xl bg-gray-800 hover:bg-gray-900 text-white font-bold text-sm flex items-center justify-center gap-2 transition-all shadow-md active:scale-95"
                                >
                                    {isSaving ? <Loader2 size={16} className="animate-spin" /> : <Save size={16} />}
                                    حفظ
                                </button>
                            </div>

                            {initialData && (
                                <button 
                                    onClick={onDelete}
                                    className="w-full text-center text-xs text-red-400 hover:text-red-600 font-bold mt-1 py-1 hover:bg-red-50 rounded transition-colors flex items-center justify-center gap-1"
                                >
                                    <Trash2 size={12} />
                                    إزالة من اليوم
                                </button>
                            )}
                        </div>

                    </div>
                </div>
            );
        };

        // 3. Main Dashboard Component
        const Dashboard = ({ user, onLogout }) => {
            const [daysData, setDaysData] = useState({});
            const [currentDate, setCurrentDate] = useState(new Date());
            const [showConfetti, setShowConfetti] = useState(false);
            const [showSadConfetti, setShowSadConfetti] = useState(false);
            const [dbError, setDbError] = useState(null); 
            const [isLoading, setIsLoading] = useState(true); 
            const [greeting, setGreeting] = useState('');
            const [egyptTime, setEgyptTime] = useState('');
            const [mainTitle, setMainTitle] = useState('أحلى يمنى في الدنيا كلها');

            // --- Sticky Note State ---
            const [noteModalOpen, setNoteModalOpen] = useState(false);
            const [selectedDateForNote, setSelectedDateForNote] = useState(null);

            // --- CLOCK & GREETING (Restored Original Logic) ---
            useEffect(() => {
                const updateTime = () => {
                    setEgyptTime(new Date().toLocaleTimeString('ar-EG', {
                        hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Africa/Cairo'
                    }));
                };
                updateTime();
                const timer = setInterval(updateTime, 1000 * 60);

                const hour = new Date().getHours();
                const isMorning = hour >= 6 && hour < 15;
                
                // RESTORED ORIGINAL GREETINGS
                const morningGreetings = [
                    "صباح الفُل 🌸",
                    "صباح الخير ☀️",
                    "صباح جميل زي قلبك ❤️",
                ];

                const eveningGreetings = [
                    "مساء الفُل 🌙",
                    "مساء الخير ✨",
                    "مساء الفُل ❤️",
                    "تصبحي على كل حاجة جميلة شبهك 🌟"
                ];

                const list = isMorning ? morningGreetings : eveningGreetings;
                const randomMsg = list[Math.floor(Math.random() * list.length)];
                setGreeting(randomMsg);

                // RESTORED ORIGINAL TITLES (Removed invented ones)
                const titleOptions = [
                    "أحلى يمنى في الدنيا كلها",
                    "بحبك"
                ];
                setMainTitle(titleOptions[Math.floor(Math.random() * titleOptions.length)]);

                return () => clearInterval(timer);
            }, []);

            // Firestore Sync
            useEffect(() => {
                if (!user) return;
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'challenge_days');
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = {};
                    snapshot.forEach((doc) => { data[doc.id] = doc.data(); });
                    setDaysData(data);
                    setIsLoading(false); 
                }, (error) => {
                    console.error("Error fetching data:", error);
                    setDbError("مش عارف أجيب البيانات.. اتأكد من النت");
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, [user]);

            // Helper for Date Keys
            const getDateKey = (date) => {
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            };

            // Toggle Day Status
            const toggleStatus = async (dayKey) => {
                setDbError(null); 
                const currentStatus = daysData[dayKey]?.status;
                let newStatus = 'success';
                
                if (currentStatus === 'success') newStatus = 'failed';
                else if (currentStatus === 'failed') newStatus = null; 
                
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'challenge_days', dayKey);
                
                if (newStatus === 'success') {
                    setShowConfetti(true);
                    setTimeout(() => setShowConfetti(false), 2000);
                } else if (newStatus === 'failed') {
                    setShowSadConfetti(true);
                    setTimeout(() => setShowSadConfetti(false), 2000);
                }

                try {
                    await setDoc(docRef, { 
                        status: newStatus || 'pending', 
                        timestamp: new Date().toISOString() 
                    }, { merge: true });
                } catch (err) {
                    setDbError("مشكلة في الحفظ!");
                }
            };

            // --- Save Drawing Logic ---
            const saveDrawing = async (base64Image) => {
                if (!selectedDateForNote) return;
                
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'challenge_days', selectedDateForNote);
                try {
                    await setDoc(docRef, { 
                        drawing: base64Image 
                    }, { merge: true });
                } catch (err) {
                    setDbError("فشل حفظ الرسمة!");
                }
            };

            const deleteDrawing = async () => {
                if (!selectedDateForNote) return;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'challenge_days', selectedDateForNote);
                try {
                    await setDoc(docRef, { drawing: null }, { merge: true });
                    setNoteModalOpen(false); 
                } catch (err) {
                    console.error("Delete failed:", err);
                    setDbError("مشكلة في الحذف، جربي تاني");
                }
            };

            const openNote = (e, dateKey) => {
                e.stopPropagation(); 
                setSelectedDateForNote(dateKey);
                setNoteModalOpen(true);
            };

            // --- RESTORED ORIGINAL STREAK LOGIC (Calculates strictly consecutive days) ---
            const stats = useMemo(() => {
                const values = Object.values(daysData);
                const completed = values.filter(d => d.status === 'success').length;
                
                let currentStreak = 0;
                let checkDate = new Date(); 
                
                // Check if today is done, or if yesterday was done to keep streak alive
                const todayKey = getDateKey(checkDate);
                if (daysData[todayKey]?.status !== 'success') {
                    checkDate.setDate(checkDate.getDate() - 1);
                    const yesterdayKey = getDateKey(checkDate);
                    if (daysData[yesterdayKey]?.status !== 'success') {
                        currentStreak = 0;
                    } else {
                        currentStreak = 1;
                        checkDate.setDate(checkDate.getDate() - 1);
                    }
                } else {
                    currentStreak = 1;
                    checkDate.setDate(checkDate.getDate() - 1);
                }

                // Count backwards
                if (currentStreak > 0) {
                    for (let i = 0; i < 365; i++) { 
                        const key = getDateKey(checkDate);
                        if (daysData[key]?.status === 'success') {
                            currentStreak++;
                            checkDate.setDate(checkDate.getDate() - 1);
                        } else {
                            break;
                        }
                    }
                }

                return { completed, total: values.length, streak: currentStreak };
            }, [daysData]);

            // Calendar Logic
            const monthNames = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
            const { days, firstDay } = useMemo(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                return { 
                    days: new Date(year, month + 1, 0).getDate(), 
                    firstDay: new Date(year, month, 1).getDay() 
                };
            }, [currentDate]);

            const changeMonth = (offset) => {
                const newDate = new Date(currentDate.setMonth(currentDate.getMonth() + offset));
                setCurrentDate(new Date(newDate));
            };

            return (
                <div className="min-h-screen animate-gradient pb-10 font-sans text-gray-800" dir="rtl">
                    <style>{styles}</style>
                    
                    {showConfetti && <div className="fixed inset-0 z-50 pointer-events-none flex items-center justify-center"><div className="text-6xl animate-bounce">🎉</div></div>}
                    {showSadConfetti && <div className="fixed inset-0 z-50 pointer-events-none flex items-center justify-center"><div className="text-6xl animate-drop">💔</div></div>}
                    {dbError && <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-red-50 text-red-600 px-6 py-3 rounded-xl shadow-lg border border-red-200">{dbError}</div>}

                    <StickyNoteCanvas 
                        isOpen={noteModalOpen} 
                        onClose={() => setNoteModalOpen(false)}
                        onSave={saveDrawing}
                        onDelete={deleteDrawing}
                        initialData={daysData[selectedDateForNote]?.drawing}
                        date={selectedDateForNote}
                    />

                    {/* RESTORED ORIGINAL HEADER WITH COUNTERS */}
                    <header className="glass-button sticky top-0 z-20 border-b-0 border-b-white/20">
                        <div className="max-w-2xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-pink-500/10 p-2 rounded-xl border border-pink-200">
                                    <Trophy className="w-6 h-6 text-pink-600" />
                                </div>
                                <div>
                                    <h1 className="font-bold text-gray-800 text-lg">التاسك اليومي</h1>
                                    <p className="text-xs text-gray-500 font-bold flex items-center gap-1">
                                        <Clock className="w-3 h-3" />
                                        {egyptTime}
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2">
                                {/* Logout */}
                                <button onClick={onLogout} className="bg-white/50 text-gray-500 p-2 rounded-full border border-pink-100 hover:text-red-500 transition-colors"><LogOut className="w-5 h-5" /></button>

                                {/* Restored Streak Counter */}
                                <div className="bg-orange-50 px-3 py-1.5 rounded-full border border-orange-200 shadow-sm flex items-center gap-1">
                                    <span className="text-sm font-bold text-orange-600">{stats.streak}</span>
                                    <Flame className="w-4 h-4 text-orange-500 fill-orange-500 animate-burn" />
                                </div>

                                {/* Restored Stars Counter */}
                                <div className="bg-white/50 px-3 py-1.5 rounded-full border border-pink-100 shadow-sm flex items-center gap-2">
                                    <span className="text-sm font-bold text-green-600">{stats.completed}</span>
                                    <Sparkles className="w-4 h-4 text-yellow-500" />
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-2xl mx-auto px-4 py-6 space-y-6 relative z-10">
                        {/* Welcome */}
                        <div className="glass-card rounded-3xl p-6 relative overflow-hidden group">
                            <div className="relative z-10 flex gap-4 items-center">
                                <div className="bg-pink-100 p-3 rounded-full"><Heart className="w-8 h-8 text-pink-500 fill-pink-500" /></div>
                                <div>
                                    <h2 className="text-2xl font-bold mb-1 bg-gradient-to-r from-pink-600 to-purple-600 bg-clip-text text-transparent">{mainTitle}</h2>
                                    <p className="text-gray-600 text-sm font-bold">{greeting}</p>
                                </div>
                            </div>
                        </div>

                        {/* Calendar */}
                        <div className="glass-card rounded-3xl shadow-sm p-5 relative min-h-[300px]">
                            {isLoading && <div className="absolute inset-0 z-20 bg-white/50 backdrop-blur-sm flex items-center justify-center"><Loader2 className="animate-spin text-pink-500" /></div>}
                            
                            <div className="flex justify-between mb-6">
                                <button onClick={() => changeMonth(-1)}><ChevronRight /></button>
                                <h2 className="font-bold text-xl text-pink-500">{monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}</h2>
                                <button onClick={() => changeMonth(1)}><ChevronLeft /></button>
                            </div>

                            <div className="grid grid-cols-7 gap-2">
                                {['حد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'].map(d => <div key={d} className="text-center text-xs text-gray-400 font-bold py-2">{d}</div>)}
                                {[...Array(firstDay)].map((_, i) => <div key={`e-${i}`} />)}
                                {[...Array(days)].map((_, i) => {
                                    const dayNum = i + 1;
                                    const dateKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                                    const dayData = daysData[dateKey];
                                    const status = dayData?.status;
                                    const hasDrawing = dayData?.drawing;
                                    const isToday = new Date().toDateString() === new Date(currentDate.getFullYear(), currentDate.getMonth(), dayNum).toDateString();

                                    return (
                                        <div key={dayNum} className="relative group">
                                            <button
                                                onClick={() => toggleStatus(dateKey)}
                                                className={`
                                                    w-full aspect-square rounded-2xl flex flex-col items-center justify-center relative transition-all duration-300
                                                    ${status === 'success' ? 'bg-gradient-to-br from-green-400 to-green-500 shadow-lg scale-105' : 
                                                      status === 'failed' ? 'bg-gradient-to-br from-red-400 to-red-500 shadow-lg' : 
                                                      'bg-white/40 hover:bg-white/80 border border-white/40'}
                                                    ${isToday ? 'ring-2 ring-pink-400 ring-offset-2' : ''}
                                                `}
                                            >
                                                <span className={`text-sm font-bold ${status ? 'text-white' : 'text-gray-600'}`}>{dayNum}</span>
                                                {status === 'success' && <Check className="w-5 h-5 text-white animate-[pop_0.3s_ease-out]" />}
                                                {status === 'failed' && <X className="w-5 h-5 text-white animate-[pop_0.3s_ease-out]" />}
                                            </button>

                                            {/* Drawing Button (The Pen) - Mobile Friendly Fix Preserved */}
                                            <button
                                                onClick={(e) => openNote(e, dateKey)}
                                                className={`absolute -top-1 -left-1 p-1.5 rounded-full shadow-sm transition-all transform hover:scale-110 z-10
                                                    ${hasDrawing 
                                                        ? 'bg-yellow-100 text-yellow-600 border border-yellow-300 opacity-100' 
                                                        : 'bg-white text-gray-400 border border-gray-200 opacity-100 md:opacity-0 md:group-hover:opacity-100'
                                                    }
                                                `}
                                                title="ضيفي رسمة"
                                            >
                                                {hasDrawing ? <Heart size={10} className="fill-yellow-500 text-yellow-500" /> : <PenTool size={10} />}
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('yomna_app_auth') === 'true');
            const [user, setUser] = useState(null);

            useEffect(() => {
                const initAuth = async () => { await signInAnonymously(auth); };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            if (!isAuthenticated) return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
            return <Dashboard user={user} onLogout={() => { localStorage.removeItem('yomna_app_auth'); setIsAuthenticated(false); }} />;
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
